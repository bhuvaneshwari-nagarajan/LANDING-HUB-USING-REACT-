<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="100%" height="100%">
  <defs>
    <linearGradient id="cntSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="60%" stop-color="#1d1b1d" />
      <stop offset="100%" stop-color="#2a1f22" />
    </linearGradient>
    <linearGradient id="marbleWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2a2e" />
      <stop offset="50%" stop-color="#38363d" />
      <stop offset="100%" stop-color="#222126" />
    </linearGradient>
    <linearGradient id="receptionDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfdbd3" />
      <stop offset="50%" stop-color="#c9c3b8" />
      <stop offset="100%" stop-color="#a8a194" />
    </linearGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#cntSky)" />

  <!-- Ambient Luxury Glow -->
  <circle cx="500" cy="450" r="300" fill="#A9232B" opacity="0.18" filter="blur(50px)" />
  <circle cx="650" cy="700" r="260" fill="#267B43" opacity="0.12" filter="blur(45px)" />

  <!-- Architectural Feature Wall - Nero Marquina Style -->
  <polygon points="120,180 880,140 860,880 100,910" fill="url(#marbleWall)" stroke="#4d4a54" stroke-width="1.5" />

  <!-- Gold/Bronze Inset Linear Accents on Wall -->
  <line x1="120" y1="360" x2="875" y2="320" stroke="#d4af37" stroke-width="1.5" opacity="0.6" />
  <line x1="115" y1="540" x2="870" y2="500" stroke="#d4af37" stroke-width="1.5" opacity="0.6" />
  <line x1="110" y1="720" x2="865" y2="680" stroke="#d4af37" stroke-width="1.5" opacity="0.6" />

  <!-- Subtle Veining in Stone Wall -->
  <path d="M220,200 Q360,400 480,560 Q600,720 740,860" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.12" />
  <path d="M520,160 Q600,320 680,480" stroke="#ffffff" stroke-width="0.75" fill="none" opacity="0.1" />

  <!-- Central LAND HUB Emblem on Wall -->
  <circle cx="500" cy="380" r="70" fill="none" stroke="#267B43" stroke-width="2" />
  <circle cx="500" cy="380" r="58" fill="none" stroke="#A9232B" stroke-width="1.5" opacity="0.8" />
  <text x="500" y="388" fill="#F7F6F1" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="4">LH</text>

  <!-- Advisory Desk in Foreground -->
  <polygon points="180,780 820,740 850,1050 150,1080" fill="url(#receptionDesk)" stroke="#8f8779" stroke-width="1.5" />
  <!-- Bevel Face -->
  <polygon points="150,1080 850,1050 840,1120 160,1140" fill="#91887a" />
  <!-- Linear LED Sconce along base -->
  <line x1="160" y1="1140" x2="840" y2="1120" stroke="#267B43" stroke-width="3" opacity="0.8" />

  <!-- Minimalist Architectural Floor -->
  <polygon points="0,960 1000,920 1000,1250 0,1250" fill="#0f0f12" />

  <!-- Architectural Up-lights on Floor -->
  <circle cx="280" cy="980" r="4" fill="#ffffff" />
  <polygon points="280,976 240,840 320,840" fill="#ffe082" opacity="0.15" />
  <circle cx="720" cy="960" r="4" fill="#ffffff" />
  <polygon points="720,956 680,820 760,820" fill="#ffe082" opacity="0.15" />
</svg>
