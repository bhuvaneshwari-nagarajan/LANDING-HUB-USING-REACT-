<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="insBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151b" />
      <stop offset="60%" stop-color="#191c24" />
      <stop offset="100%" stop-color="#212228" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#insBg)" />

  <!-- Blueprint & Analytical Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.08">
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="240" y1="0" x2="240" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="560" y1="0" x2="560" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />

    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Golden & Crimson Analytical Glow -->
  <circle cx="400" cy="250" r="150" fill="#A9232B" opacity="0.12" filter="blur(40px)" />
  <circle cx="500" cy="200" r="120" fill="#267B43" opacity="0.1" filter="blur(30px)" />

  <!-- Isometric Wireframe Structural Model of Modern Residence -->
  <!-- Base Foundation -->
  <polygon points="400,100 680,240 400,380 120,240" fill="none" stroke="#A9232B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <polygon points="400,160 620,270 400,380 180,270" fill="none" stroke="#267B43" stroke-width="1.5" opacity="0.8" />

  <!-- Upper Structural Planes -->
  <polygon points="400,80 580,170 400,260 220,170" fill="rgba(255,255,255,0.03)" stroke="#ffffff" stroke-width="1.5" opacity="0.85" />
  <polygon points="400,120 540,190 400,260 260,190" fill="rgba(169,35,43,0.15)" stroke="#A9232B" stroke-width="1" />

  <!-- Vertical Load Bearing Markers -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.4">
    <line x1="220" y1="170" x2="220" y2="290" />
    <line x1="400" y1="260" x2="400" y2="380" />
    <line x1="580" y1="170" x2="580" y2="290" />
    <line x1="400" y1="80" x2="400" y2="200" />
  </g>

  <!-- Architectural Metric Calibration Labels (Vector) -->
  <text x="140" y="230" fill="#A9232B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1">LTV &middot; 80% MAX</text>
  <text x="610" y="230" fill="#267B43" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1">EIBOR BENCHMARK</text>
  <text x="350" y="415" fill="#ffffff" opacity="0.6" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" letter-spacing="1">TENURE: 25Y CAP</text>

  <!-- Technical Centerpoint -->
  <circle cx="400" cy="260" r="4" fill="#A9232B" />
  <circle cx="400" cy="260" r="10" fill="none" stroke="#A9232B" stroke-width="1" opacity="0.6" />
</svg>
